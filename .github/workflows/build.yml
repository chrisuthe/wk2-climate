name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone. app/build.gradle.kts derives
          # versionCode from `git rev-list --count HEAD`, and a shallow clone
          # counts 1 commit -- which would silently ship version 1 forever,
          # the exact problem the derivation exists to fix.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Every module compiles to JVM 17 (sourceCompatibility and
          # jvmTarget). Building on a newer JDK works but there is no reason to
          # differ from the target here.
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # `build` covers assemble, the unit tests and lint. There are no
      # instrumented tests in this project -- everything is plain JVM, which is
      # deliberate and is why CI needs no emulator.
      - name: Build, test and lint
        run: ./gradlew build --no-daemon

      # The same two git commands app/build.gradle.kts uses, so the log says
      # what went into the APK. A `versionCode` of 1 here means the checkout was
      # shallow after all and `fetch-depth: 0` has stopped working.
      - name: Report the version this produced
        if: always()
        run: |
          echo "versionCode: $(git rev-list --count HEAD)"
          echo "versionName: $(git describe --tags --always --dirty)"

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Only on failure: the reports are large and are the first thing wanted
      # when something breaks.
      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
